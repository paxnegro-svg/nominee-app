<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Urban X Awards - Nominee Creator</title>
    <style>
        :root { --gold: #f3cc7a; --dark: #1a1a1a; --bg: #0f0f0f; }
        body { 
            font-family: 'Georgia', serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: var(--bg); 
            color: white; 
            margin: 0; 
            padding: 10px;
            overflow-x: hidden;
        }
        .container { 
            max-width: 400px; 
            width: 100%; 
            background: var(--dark); 
            padding: 15px; 
            border-radius: 15px; 
            border: 1px solid #333; 
            box-sizing: border-box;
        }
        .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
        label { font-size: 12px; font-weight: bold; color: var(--gold); margin-bottom: 2px; display: block; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #444; border-radius: 8px; background: #222; color: white; box-sizing: border-box; font-size: 14px; }
        
        /* Category box made smaller to save space on mobile */
        .cat-box { height: 100px; overflow-y: auto; background: #222; border: 1px solid #444; border-radius: 8px; padding: 8px; }
        .cat-item { font-size: 11px; color: #ccc; display: block; margin-bottom: 5px; }
        
        /* This container forces the canvas to fit the screen width */
        .canvas-container { 
            position: relative; 
            width: 100%; 
            max-height: 70vh; /* Limits height to 70% of screen height */
            aspect-ratio: 2/3; 
            border: 1px solid var(--gold); 
            margin-top: 10px;
            overflow: hidden;
            touch-action: none;
        }
        canvas { 
            width: 100%; 
            height: auto; 
            display: block; 
            touch-action: none; 
            -webkit-user-select: none; 
        }
        #saveBtn { width: 100%; padding: 14px; background: var(--gold); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <label>1. Photo</label><input type="file" id="upload" accept="image/*">
        <label>2. Name</label><input type="text" id="userName" placeholder="NOMINEE NAME" maxlength="25">
        <label>3. Category</label><div class="cat-box" id="catBox"></div>
        <button id="saveBtn">DOWNLOAD CARD</button>
    </div>
    <div class="canvas-container">
        <canvas id="canvas" width="1000" height="1500"></canvas>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    const upload = document.getElementById('upload'), userNameInput = document.getElementById('userName'), catBox = document.getElementById('catBox');
    
    // Category list from your requirements
    const categories = ["URBAN X HOTTIE", "URBAN X STUD", "ORGASMIC ORALIST", "TALENTED TONGUE", "MOST AMAZING ASS", "MOST BEAUTIFUL BREAST", "MOST HUNG MALE STAR", "SEXIEST BBW STAR", "SEXIEST TRANS STAR", "MOST POPULAR BBW STAR", "MOST POPULAR TRANS STAR", "HOTTEST FETISH STAR", "HOTTEST INKED STAR FEMALE", "HOTTEST INKED STAR MALE", "MOST POPULAR POV MALE STAR", "RISING STAR FEMALE", "BEST MALE NEWCOMER", "MOST POPULAR PR COMPANY", "MOST POPULAR PODCAST/RADIO SHOW", "MOST POPULAR TALENT AGENCY", "MOST SUPPORTIVE SPONSOR", "MOST POPULAR CONTENT CREATOR PLATFORM", "MOST POPULAR WEB CAM COMPANY", "MOST POPULAR WEB CAM MODEL", "SOCIAL MEDIA STAR (MALE)", "SOCIAL MEDIA STAR (FEMALE)", "FAN FAVORITE MALE CREATOR", "FAN FAVORITE FEMALE CREATOR", "FAN FAVORITE BBW CREATOR", "FAN FAVORITE TRANS CREATOR", "FAN FAVORITE GAY CREATOR", "MOST POPULAR NOVELTY COMPANY", "BEST EVENT PHOTOGRAPHER", "FAN FAVORITE PRO-AM MALE", "FAN FAVORITE PRO-AM FEMALE", "MOST POPULAR PRO-AM STUDIO", "BEST NEW ALT MODEL", "ALT MODEL of the YEAR", "SPECTACULAR SQUIRTING STAR", "FEMALE PERFORMER of the YEAR", "MALE PERFORMER of the YEAR", "ANAL PERFORMER of the YEAR", "GAY PERFORMER of the YEAR", "TRANSGENDER PERFORMER of the YEAR", "MILF PERFORMER of the YEAR", "TRANS MASCULINE PERFORMER", "PANSEXUAL PERFORMER of the YEAR", "FAN FAVORITE DIRECTOR", "MOST POPULAR NEW STUDIO", "MOST POPULAR STUDIO", "BEST ACTRESS", "BEST ACTOR", "BEST COUPLE SEX SCENE", "BEST GIRL GIRL SCENE", "BEST GANG BANG SCENE", "BEST ORAL SCENE", "INDUSTRY FAVORITE COUPLE", "MR. GOOD STROKE", "MISS PRETTY KITTY", "PORN STAR-NEXT-DOOR", "MUSIC ARTIST, MALE", "MUSIC ARTIST, FEMALE"];

    categories.forEach(cat => { catBox.innerHTML += `<label class="cat-item"><input type="checkbox" class="cat-check" value="${cat}"> ${cat}</label>`; });

    let userImg = new Image(), frameImg = new Image(), isLoaded = false;
    let imgX = 500, imgY = 750, imgScale = 1;

    // IMPORTANT: Ensure frame.png is transparent in the center!
    frameImg.src = 'frame.png'; 
    frameImg.onload = draw;

    function draw() {
        ctx.clearRect(0,0,1000,1500);
        
        // 1. User Photo
        if(isLoaded) {
            ctx.save(); ctx.translate(imgX, imgY); ctx.scale(imgScale, imgScale);
            ctx.drawImage(userImg, -userImg.width/2, -userImg.height/2); ctx.restore();
        }
        
        // 2. Frame
        ctx.drawImage(frameImg, 0, 0, 1000, 1500);
        
        // 3. Name Alignment
        const name = userNameInput.value.toUpperCase();
        if(name) {
            let size = 65; ctx.font = `bold ${size}px Georgia`;
            while(ctx.measureText(name).width > 800 && size > 20) { size -= 2; ctx.font = `bold ${size}px Georgia`; }
            
            const grad = ctx.createLinearGradient(0, 1050, 0, 1150);
            grad.addColorStop(0, "#f3cc7a"); grad.addColorStop(0.5, "#c5a059"); grad.addColorStop(1, "#8e6d2b");
            
            ctx.fillStyle = grad; ctx.strokeStyle = "black"; ctx.lineWidth = 4;
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.strokeText(name, 500, 1115); ctx.fillText(name, 500, 1115);
        }

        // 4. Category Alignment
        const cats = Array.from(document.querySelectorAll('.cat-check:checked')).map(c => c.value);
        if(cats.length > 0) {
            ctx.fillStyle = "black"; ctx.font = "bold 32px Arial";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(cats.slice(0, 1).join(" • "), 500, 1375);
        }
    }

    upload.onchange = (e) => {
        const r = new FileReader();
        r.onload = (ev) => { userImg.onload = () => { isLoaded = true; draw(); }; userImg.src = ev.target.result; };
        r.readAsDataURL(e.target.files[0]);
    };
    catBox.onchange = draw;
    userNameInput.oninput = draw;

    // Improved Drag/Touch Logic for iPhone
    let isDragging = false, startX, startY;
    
    const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (1000 / rect.width),
            y: (clientY - rect.top) * (1500 / rect.height)
        };
    };

    canvas.addEventListener('mousedown', (e) => { isDragging = true; const p = getPos(e); startX = p.x - imgX; startY = p.y - imgY; });
    window.addEventListener('mousemove', (e) => { if(isDragging) { const p = getPos(e); imgX = p.x - startX; imgY = p.y - startY; draw(); } });
    window.addEventListener('mouseup', () => isDragging = false);

    canvas.addEventListener('touchstart', (e) => { 
        isDragging = true; const p = getPos(e); startX = p.x - imgX; startY = p.y - imgY; 
    }, {passive:false});
    canvas.addEventListener('touchmove', (e) => { 
        if(isDragging) { e.preventDefault(); const p = getPos(e); imgX = p.x - startX; imgY = p.y - startY; draw(); } 
    }, {passive:false});
    canvas.addEventListener('touchend', () => isDragging = false);

    document.getElementById('saveBtn').onclick = () => {
        const link = document.createElement('a'); 
        link.download = 'UrbanX_Nominee.png'; 
        link.href = canvas.toDataURL('image/png'); 
        link.click();
    };
</script>
</body>
</html>
