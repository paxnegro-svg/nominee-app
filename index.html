<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LensFrame - Custom Trading Cards</title>
    <style>
        :root { --primary: #007bff; --secondary: #6c757d; --bg: #f0f2f5; }
        body { font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 500px; width: 100%; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); box-sizing: border-box; }
        
        header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        header h1 { margin: 0; color: #333; font-size: 24px; }
        
        .controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 14px; font-weight: bold; color: #555; }
        
        input[type="text"], input[type="file"] { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        
        .btn-group { display: flex; gap: 8px; }
        button { flex: 1; padding: 12px; cursor: pointer; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; }
        #resetBtn { background: var(--secondary); }
        #shareBtn { background: #25d366; }

        .zoom-wrap { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #555; margin: 10px 0; }
        #zoomSlider { flex-grow: 1; cursor: pointer; }

        .gallery { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; border-top: 1px solid #eee; }
        .frame-thumb { width: 65px; height: 65px; border: 3px solid #eee; border-radius: 8px; cursor: pointer; object-fit: cover; flex-shrink: 0; }
        .frame-thumb.active { border-color: var(--primary); }

        .canvas-container { position: relative; width: 100%; aspect-ratio: 1/1; background: #000; border-radius: 10px; overflow: hidden; touch-action: none; margin-top: 10px; }
        canvas { width: 100%; height: 100%; display: block; cursor: move; }
        
        .instructions { text-align: center; font-size: 12px; color: #999; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>LensFrame</h1>
    </header>

    <div class="controls">
        <div class="input-group">
            <label>1. Upload Photo</label>
            <input type="file" id="upload" accept="image/*">
        </div>

        <div class="input-group">
            <label>2. Nominee Name</label>
            <input type="text" id="userName" placeholder="Enter name..." maxlength="20">
        </div>
        
        <div class="zoom-wrap">
            <label>Zoom:</label>
            <input type="range" id="zoomSlider" min="0.1" max="4" step="0.01" value="1">
        </div>

        <div class="btn-group">
            <button id="resetBtn">Reset</button>
            <button id="saveBtn">Save</button>
            <button id="shareBtn">Share</button>
        </div>
    </div>

    <div class="gallery" id="frameGallery">
        <img src="frame1.png" class="frame-thumb active" data-src="frame1.png">
        <img src="frame2.png" class="frame-thumb" data-src="frame2.png">
    </div>

    <div class="canvas-container">
        <canvas id="canvas" width="1080" height="1080"></canvas>
